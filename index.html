<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, original-scale=1"> 
<title>Order Summary</title> 
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet"> 
<link rel="stylesheet" href="style.css"> 
</head> 
<body> 

<div class="card"> 
<img class="hero" src="images/illustration-hero.svg" alt="Person enjoying music"> 

<div class="content"> 
<h1>Order summary</h1> 
<p class="description"> 
Now you can listen to your favorite songs, audiobooks and podcasts wherever you are, on any device. 
</p> 

<div class="plan"> 
<img src="images/icon-music.svg" alt="" width="48" height="48"> 
<div class="plan-text"> 
<h2>Annual plan</h2> 
<p>$59.99 per year</p> 
</div> 
<a class="change" href="#">Change</a> 
</div> 

<button class="pay-button">Proceed to payment</button> 
<a class="cancel" href="#">Cancel order</a> 
</div> 
</div> 

</body> 
</html>
